# Every push and PR: lint, types, migrations, and the full test suite against real Postgres.
# No LLM calls and no API keys (D-019). The LLM eval suite gets its own manually dispatched
# workflow in Phase 3.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_agent_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking_agent_test
      TEST_DATABASE_URL: postgresql+asyncpg://booking:booking@localhost:5432/booking_agent_test
    steps:
      - uses: actions/checkout@v7

      # setup-uv stopped publishing floating major tags (no "v10"), so pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrations upgrade, downgrade, upgrade
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest
