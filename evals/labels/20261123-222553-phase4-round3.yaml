instructions: Answer every label yes or no from the transcript alone.
questions:
  sms_style: 'Is every message from the business short, plain text that reads well as an SMS: no markdown,
    no bullet lists, no long paragraphs?'
  polite: Is the business polite and professional throughout, including when it declines something or
    hands the customer to a person?
  no_unfounded_promise: Does the business avoid promising anything it had no basis for, such as an exact
    arrival time, a particular technician, a price, or that a job will definitely be fixed? (Offering
    or confirming an arrival window is fine.)
  one_question: Does the business avoid asking several questions in one message, and avoid asking again
    for something the customer already gave?
  customer_in_character: Does the CUSTOMER behave like a real customer throughout (never acting as the
    business, never mentioning being an AI or a simulation)?
