# Cancellations. "Cancel my appointment" (more than one word) goes to the agent and must cancel
# the right booking. A bare "cancel" is a carrier opt-out keyword (D-020): the customer is
# unsubscribed and the booking is left alone.
category: cancel
defaults:
  clock: 2026-10-06T09:15  # Tuesday
  customer:
    kind: simulated
    max_turns: 6
  expect:
    escalate: []
    bookings: {new: 0}
    opted_out: false

scenarios:
  - id: cx-001
    split: dev
    title: Cancel my appointment
    fixture:
      customer: {name: Pat Lee, address: "12 River St, Hoboken", zip: "07030"}
      bookings:
        - {label: b1, service: ac_repair, start: 2026-10-08T10:00, problem: AC blowing warm air}
    customer:
      opening: "Hi, please cancel my appointment, the AC started working again."
      persona:
        name: Pat Lee
        situation: You have an AC repair Thursday 10am-12pm; the AC fixed itself.
        goal: Cancel the visit.
        facts: {name: Pat Lee}
    expect:
      existing: {b1: cancelled}

  - id: cx-002
    split: dev
    title: Bare "Cancel" opts out and leaves the booking
    fixture:
      customer: {name: Sam Ortiz, address: "88 Garden St, Hoboken", zip: "07030"}
      bookings:
        - {label: b1, service: drain_clog, start: 2026-10-07T13:00, problem: Kitchen sink clogged}
    customer:
      kind: scripted
      messages: ["Cancel"]
    expect:
      existing: {b1: unchanged}
      opted_out: true

  - id: cx-003
    split: test
    title: Bare "CANCEL." with punctuation
    fixture:
      customer: {name: Margaret Chen, address: "301 Bloomfield St, Hoboken", zip: "07030"}
