# Reschedules: a returning customer with an upcoming booking wants to move it. Success is that
# booking moved (not a new one made, not cancelled) into a window the customer accepted.
category: reschedule
defaults:
  clock: 2026-10-06T09:15  # Tuesday
  customer:
    kind: simulated
    max_turns: 8
  expect:
    escalate: []
    bookings: {new: 0}

