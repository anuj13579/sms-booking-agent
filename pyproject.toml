[project]
name = "booking-agent"
version = "0.1.0"
description = "SMS booking agent for small HVAC, plumbing, and electrical businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    # zoneinfo needs the IANA database; Windows has no system copy.
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "DTZ", "PT"]
ignore = [
    "RUF001", # ambiguous unicode in strings: the tests use en dashes on purpose
    "PT018",  # compound asserts document invariants for mypy; splitting them adds noise
    "SIM108", # if/else is clearer than a ternary for multi-branch assignments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true
