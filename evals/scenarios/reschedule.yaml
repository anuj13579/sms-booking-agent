    split: dev
    title: Move Thursday morning to Friday morning
    fixture:
      customer: {name: Pat Lee, address: "12 River St, Hoboken", zip: "07030"}
      bookings:
        - {label: b1, service: ac_repair, start: 2026-10-08T10:00, problem: AC blowing warm air}
    customer:
      opening: "Hi, I can't do Thursday anymore for the AC visit. Can we move it to Friday morning?"
      persona:
        name: Pat Lee
        situation: You have an AC repair booked Thursday 10am-12pm and something came up.
        goal: Move the visit to Friday morning.
        facts: {name: Pat Lee, address: "12 River St, Hoboken", zip: "07030"}
        availability: Friday (October 9) morning.
    expect:
      existing:
        b1: {state: rescheduled, windows: [{date: 2026-10-09, from: "08:00", until: "11:59"}]}

