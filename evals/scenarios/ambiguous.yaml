# Ambiguous or incomplete requests: vague problems, relative dates, missing or wrong details,
# times the business doesn't offer. The agent has to ask, clarify, and still book the right thing.
category: ambiguous
defaults:
  clock: 2026-10-06T09:15  # Tuesday
  customer:
    kind: simulated
    max_turns: 10
  expect:
    escalate: []
    bookings: {new: 1}

